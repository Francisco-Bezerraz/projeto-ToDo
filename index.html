<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Quest! ⚔️ - Seu Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Task Quest! ⚔️</h1>
    <p>Conquiste o seu dia tarefa por tarefa!</p>
  </header>

  <main>

    <section aria-labelledby="form-title">
      <h2 id="form-title">🎮 Nova Missão</h2>
      
      <form id="task-form">
        <input type="hidden" id="task-id">

        <div>
          <label for="task-title">Título da Missão *</label>
          <input 
            type="text" 
            id="task-title" 
            name="title" 
            placeholder="Ex: Derrotar o dragão da procrastinação" 
            required
          >
        </div>

        <div>
          <label for="task-description">Detalhes da Aventura</label>
          <textarea 
            id="task-description" 
            name="description" 
            rows="3" 
            placeholder="Opcional: Traga poções e equipamentos..."
          ></textarea>
        </div>

        <button type="submit" id="btn-save">🚀 Lançar Missão</button>
        <button type="button" id="btn-cancel" hidden>❌ Cancelar</button>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">📜 Quadro de Missões</h2>

      <div id="state-loading" role="status" aria-live="polite">
        <p>🔮 Invocando suas missões do servidor...</p>
      </div>

      <div id="state-empty" hidden>
        <p>🎉 Nenhuma missão pendente! Você venceu por hoje!</p>
      </div>

      <div id="state-error" role="alert" hidden>
        <p>💥 Ops! O monstro da rede interrompeu a conexão com a API.</p>
        <button type="button" id="btn-retry">🔄 Tentar Novamente</button>
      </div>

      <ul id="task-list" aria-label="Lista de tarefas">
        </ul>
    </section>

  </main>

  <footer>
    <p>Feito🚀</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
