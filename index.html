<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Quest! ⚔️ - Seu Gerenciador de Tarefas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caacupe&family=Marcellus&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/CSS/style.css">
</head>
<body>

  <header>
    <h1>Task Quest! ⚔️</h1>
    <p>Conquiste o seu dia tarefa por tarefa!</p>
  </header>

  <div id="feedback-overlay" class="feedback-overlay" hidden>
    <img id="feedback-image" src="" alt="Feedback da ação">
    <p id="feedback-text"></p>
  </div>

  <main>


    <section aria-labelledby="form-title" class="card">
      <h2 id="form-title">🎮 Nova Missão</h2>
      
      <form id="task-form">
        <input type="hidden" id="task-id">

        <div class="form-group">
          <label for="task-title">Título da Missão *</label>
          <input 
            type="text" 
            id="task-title" 
            name="title" 
            placeholder="Ex: Derrotar o dragão da procrastinação" 
            required
          >
        </div>

        <div class="form-group">
          <label for="task-description">Detalhes da Aventura</label>
          <textarea 
            id="task-description" 
            name="description" 
            rows="3" 
            placeholder="Opcional: Traga poções e equipamentos..."
          ></textarea>
        </div>

        <div class="button-group">
          <button type="submit" id="btn-save" class="btn btn-primary">🚀 Lançar Missão</button>
          <button type="button" id="btn-cancel" class="btn btn-danger" hidden>❌ Cancelar</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="list-title" class="card">
      <h2 id="list-title">📜 Quadro de Missões</h2>

      <div id="state-loading" role="status" aria-live="polite" class="status-msg">
        <p>🔮 Invocando suas missões do servidor...</p>
      </div>

      <div id="state-empty" class="status-msg" hidden>
        <p>🎉 Nenhuma missão pendente! Você venceu por hoje!</p>
      </div>

      <div id="state-error" role="alert" class="status-msg error" hidden>
        <p>💥 Ops! O monstro da rede interrompeu a conexão com a API.</p>
        <button type="button" id="btn-retry" class="btn btn-warning">🔄 Tentar Novamente</button>
      </div>

      <ul id="task-list" aria-label="Lista de tarefas">
      </ul>
    </section>

  </main>

  <footer>
    <p>Feito🚀</p>
  </footer>

  <script src="/assets/JS/app.js"></script>
</body>
</html>
